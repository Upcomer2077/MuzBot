name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ] 
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']   

permissions:
  packages: write
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5 
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14" 

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Ruff Linter
        run: uv run ruff check .

      - name: Run Ruff Formatter
        run: uv run ruff format --check .

      - name: Run Tests
        run: uv run pytest 

  build-and-push:
    runs-on: ubuntu-latest
    needs: lint-and-test 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from Git Tag
        id: get-tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME=${GITHUB_REF#refs/tags/}
            CLEAN_VERSION=${TAG_NAME#v}
          else
            CLEAN_VERSION="latest-dev"
          fi
          echo "VERSION=$CLEAN_VERSION" >> $GITHUB_ENV
          echo "version=$CLEAN_VERSION" >> $GITHUB_OUTPUT

      - name: Log in to the Container registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false 
          tags: |
            type=raw,value=${{ steps.get-tag.outputs.version }}

            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(steps.get-tag.outputs.version, 'a') && !contains(steps.get-tag.outputs.version, 'b') && !contains(steps.get-tag.outputs.version, 'rc') }}            

            type=raw,value=beta,enable=${{ contains(steps.get-tag.outputs.version, 'b') }}
            type=raw,value=alpha,enable=${{ contains(steps.get-tag.outputs.version, 'a') }}



      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=build-${{ github.ref_name }}
            type=gha,scope=build-main
          cache-to: type=gha,mode=max,scope=build-${{ github.ref_name }}

