[project]
name = "muzbot"
version = "1.11.0"
description = "Download music from youtube music to telegram"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.29.1",
    "aiosqlite>=0.22.1",
    "apscheduler>=3.11.3",
    "load-dotenv>=0.1.0",
    "loki-logger-handler>=1.1.2",
    "peewee>=4.2.6",
    "peewee-aio>=3.1.6",
    "yt-dlp>=2026.7.4",
    "ytmusicapi>=1.12.1",
]

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-env", "ruff>=0.15.22"]

[tool.pytest.ini_options]
pythonpath = ["."]
env_files = [".env.example"]

[tool.ruff.lint]
ignore = ["BLE001", "TRY002", "N999"]
