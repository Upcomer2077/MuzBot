[project]
name = "muzbot"
version = "1.2.0"
description = "Download music from youtube music to telegram"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.29.1",
    "aiosqlite>=0.22.1",
    "load-dotenv>=0.1.0",
    "peewee>=4.2.6",
    "peewee-aio>=3.1.6",
    "yt-dlp>=2026.7.4",
    "ytmusicapi>=1.12.1",
]

[dependency-groups]
dev = [
    "ruff>=0.15.22",
]
